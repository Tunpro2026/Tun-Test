name: Cloud Python Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  run-python-job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Execute My Custom Script
      run: |
        python my_script.py
